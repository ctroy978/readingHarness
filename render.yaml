services:
  - type: web
    name: reading-harness
    runtime: python
    plan: free
    buildCommand: uv sync --frozen --no-dev
    startCommand: uv run uvicorn server.main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.11
      - key: TICKET_SECRET
        generateValue: true
      - key: GITHUB_REPO
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REF
        value: main
      - key: GITHUB_LESSON_PATH
        value: lessons
      - key: DISPLAY_TIMEZONE
        value: UTC
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: RESEND_REPLY_TO
        sync: false
      - key: ALERT_EMAIL_TO
        sync: false
